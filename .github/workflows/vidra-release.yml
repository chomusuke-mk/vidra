name: Vidra Release Workflow

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Environment Variables
        run: |
          mkdir -p .serious_python/site-packages .serious_python/app
          echo "SERIOUS_PYTHON_SITE_PACKAGES=${GITHUB_WORKSPACE}/.serious_python/site-packages" >> $GITHUB_ENV
          echo "SERIOUS_PYTHON_APP=${GITHUB_WORKSPACE}/.serious_python/app" >> $GITHUB_ENV

      - name: Download & Extract Backend
        run: |
          wget -qO backend.zip https://github.com/chomusuke-mk/vidra-backend/releases/latest/download/app.zip
          mkdir -p app/src
          unzip -q backend.zip -d app/src

      - name: Download FFmpeg (Android)
        run: |
          for ABI in "arm64-v8a" "x86_64" "armeabi-v7a"; do
            wget -qO ffmpeg_${ABI}.zip https://github.com/chomusuke-mk/vidra-ffmpeg/releases/latest/download/ffmpeg-android-${ABI}.zip
            unzip -q ffmpeg_${ABI}.zip -d ffmpeg_${ABI}
            
            OUT_DIR="android/app/src/main/jniLibs/$ABI"
            mkdir -p "$OUT_DIR"
            cp ffmpeg_${ABI}/ffmpeg "$OUT_DIR/libffmpeg.so"
            cp ffmpeg_${ABI}/ffprobe "$OUT_DIR/libffprobe.so"
          done

      - name: Download QuickJS (Android)
        run: |
          for ABI in "arm64-v8a" "x86_64" "armeabi-v7a"; do
            OUT_DIR="android/app/src/main/jniLibs/$ABI"
            mkdir -p "$OUT_DIR"
            wget -qO "quickjs_${ABI}.zip" https://github.com/chomusuke-mk/vidra-quickjs/releases/latest/download/quickjs-android-${ABI}.zip
            unzip -q "quickjs_${ABI}.zip" -d "quickjs_${ABI}"
            cp "quickjs_${ABI}/quickjs" "$OUT_DIR/libquickjs.so"
          done

      - name: Package Serious Python (Android)
        run: |
          flutter pub get
          dart run serious_python:main package app/src -r -r -r app/requirements/base.txt -r -r -r app/requirements/Android.txt -p Android --verbose

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/upload-keystore.pkcs12
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.pkcs12" >> android/key.properties

      - name: Build Flutter APKs
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk vidra-android.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk vidra-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk vidra-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk vidra-android-armeabi-v7a.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: |
            vidra-android.apk
            vidra-android-arm64-v8a.apk
            vidra-android-x86_64.apk
            vidra-android-armeabi-v7a.apk
          retention-days: 1

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm rpm-common fuse libfuse2 locate dpkg zsync
          wget -O appimagetool-real "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-real
          sudo mv appimagetool-real /usr/local/bin/
          echo '#!/bin/bash' > appimagetool
          echo 'UPDATE_INFO="gh-releases-zsync|chomusuke-mk|vidra|latest|vidra-x86_64.AppImage.zsync"' >> appimagetool
          echo '/usr/local/bin/appimagetool-real -u "$UPDATE_INFO" "$@"' >> appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Environment Variables
        run: |
          mkdir -p .serious_python/site-packages .serious_python/app
          echo "SERIOUS_PYTHON_SITE_PACKAGES=${GITHUB_WORKSPACE}/.serious_python/site-packages" >> $GITHUB_ENV
          echo "SERIOUS_PYTHON_APP=${GITHUB_WORKSPACE}/.serious_python/app" >> $GITHUB_ENV

      - name: Download & Extract Backend
        run: |
          wget -qO backend.zip https://github.com/chomusuke-mk/vidra-backend/releases/latest/download/app.zip
          mkdir -p app/src
          unzip -q backend.zip -d app/src

      - name: Download FFmpeg (Linux)
        run: |
          wget -qO ffmpeg.zip https://github.com/chomusuke-mk/vidra-ffmpeg/releases/latest/download/ffmpeg-linux-x86_64.zip
          unzip -q ffmpeg.zip -d ffmpeg_ext
          mkdir -p linux
          cp ffmpeg_ext/ffmpeg linux/ffmpeg
          cp ffmpeg_ext/ffprobe linux/ffprobe
          chmod +x linux/ffmpeg linux/ffprobe

      - name: Download QuickJS (Linux)
        run: |
          wget -qO quickjs.zip https://github.com/chomusuke-mk/vidra-quickjs/releases/latest/download/quickjs-linux-x86_64.zip
          unzip -q quickjs.zip -d quickjs_ext
          mkdir -p linux
          cp quickjs_ext/quickjs linux/quickjs
          chmod +x linux/quickjs

      - name: Package Serious Python (Linux)
        run: |
          flutter pub get
          dart run serious_python:main package app/src -r -r -r app/requirements/base.txt -r -r -r app/requirements/Linux.txt -p Linux --verbose

      - name: Build Flutter Linux
        run: flutter build linux --release

      - name: Create AppImage and DEB
        run: |
          dart pub global activate fastforge
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          fastforge release --name linux-release --skip-clean

          cp dist/vidra-x86_64.AppImage vidra-x86_64.AppImage
          cp dist/vidra-x86_64.AppImage.zsync vidra-x86_64.AppImage.zsync
          cp dist/vidra-linux.deb vidra-linux.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            vidra-x86_64.AppImage
            vidra-x86_64.AppImage.zsync
            vidra-linux.deb
          retention-days: 1

  build-windows:
    name: Build Windows Exe
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Environment Variables
        run: |
          New-Item -Path ".serious_python\site-packages" -ItemType Directory -Force
          New-Item -Path ".serious_python\app" -ItemType Directory -Force
          echo "SERIOUS_PYTHON_SITE_PACKAGES=${env:GITHUB_WORKSPACE}\.serious_python\site-packages" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SERIOUS_PYTHON_APP=${env:GITHUB_WORKSPACE}\.serious_python\app" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download & Extract Backend
        run: |
          Invoke-WebRequest -Uri "https://github.com/chomusuke-mk/vidra-backend/releases/latest/download/app.zip" -OutFile "backend.zip"
          Expand-Archive -Path "backend.zip" -DestinationPath "app\src" -Force

      - name: Download FFmpeg (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/chomusuke-mk/vidra-ffmpeg/releases/latest/download/ffmpeg-windows-x86_64.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_ext" -Force
          New-Item -ItemType Directory -Force -Path "windows"
          Copy-Item "ffmpeg_ext\ffmpeg.exe" -Destination "windows\ffmpeg.exe"
          Copy-Item "ffmpeg_ext\ffprobe.exe" -Destination "windows\ffprobe.exe"

      - name: Download QuickJS (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/chomusuke-mk/vidra-quickjs/releases/latest/download/quickjs-windows-x86_64.zip" -OutFile "quickjs.zip"
          Expand-Archive -Path "quickjs.zip" -DestinationPath "quickjs_ext" -Force
          New-Item -ItemType Directory -Force -Path "windows"
          Copy-Item "quickjs_ext\quickjs.exe" -Destination "windows\quickjs.exe"

      - name: Package Serious Python (Windows)
        run: |
          flutter pub get
          dart run serious_python:main package app/src -r -r -r app/requirements/base.txt -r -r -r app/requirements/Windows.txt -p Windows --verbose

      - name: Build Flutter Windows
        run: flutter build windows --release

      - name: Package with Inno Setup
        run: |
          $content = Get-Content pubspec.yaml | Select-String "^version: "
          $version = ($content -replace "version: ", "").Split("+")[0].Trim()
          iscc /DAppVer="$version" installer.iss
          Copy-Item "dist\vidra-windows.exe" -Destination "vidra-windows.exe"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: vidra-windows.exe
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Extract Version for Release
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: artifacts
        run: |
          sha256sum vidra-* > SHA2-256SUMS
          sha512sum vidra-* > SHA2-512SUMS

      - name: Generate GPG Signatures
        working-directory: artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output SHA2-256SUMS.sig SHA2-256SUMS
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output SHA2-512SUMS.sig SHA2-512SUMS

      - name: Generate Release Notes
        working-directory: artifacts
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BACKEND_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/chomusuke-mk/vidra-backend/releases/latest | jq -r .tag_name)
          FFMPEG_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/chomusuke-mk/vidra-ffmpeg/releases/latest | jq -r .tag_name)
          QUICKJS_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/chomusuke-mk/vidra-quickjs/releases/latest | jq -r .tag_name)


          cat <<EOF > RELEASE_NOTES.md
          # Vidra v${VERSION}

          Vidra is an advanced video download manager for desktop and mobile devices. It combines a modern Flutter user interface with a powerful Python backend (\`yt-dlp\`), integrated seamlessly as a background process.

          ## 📥 Published Executables
          The following binaries are provided for this release. Download the appropriate file for your platform from the assets below.

          | Platform | Installer                                                                                                           |
          | -------- | ------------------------------------------------------------------------------------------------------------------- |
          | Windows  | vidra-windows.exe                                                                                                   |
          | Linux    | vidra-x86_64.AppImage <br> vidra-linux.deb                                                                          |
          | Android  | vidra-android.apk <br> vidra-android-arm64-v8a.apk <br> vidra-android-x86_64.apk <br> vidra-android-armeabi-v7a.apk |

          ## 📌 Backend and Native Dependencies
          This release was dynamically built using the following versions of external dependencies:

          | Component           | Version            | Release Link                                                                              |
          | ------------------- | ------------------ | ----------------------------------------------------------------------------------------- |
          | **Vidra Backend**   | \`${BACKEND_TAG}\` | [View Release](https://github.com/chomusuke-mk/vidra-backend/releases/tag/${BACKEND_TAG}) |
          | **Vidra FFmpeg**    | \`${FFMPEG_TAG}\`  | [View Release](https://github.com/chomusuke-mk/vidra-ffmpeg/releases/tag/${FFMPEG_TAG})   |
          | **Vidra QuickJS**   | \`${QUICKJS_TAG}\` | [View Release](https://github.com/chomusuke-mk/vidra-quickjs/releases/tag/${QUICKJS_TAG}) |

          ## 🎯 Changelog
          You can view the full history of changes for this release in the [CHANGELOG.md](https://github.com/chomusuke-mk/vidra/blob/${VERSION}/CHANGELOG.md) file of this repository.

          ## 🔒 SHA2-256 Checksums
          To verify the integrity of your download, you can use the following SHA2-256 checksums:

          \`\`\`text
          $(cat SHA2-256SUMS)
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "Vidra v${{ steps.get_version.outputs.version }}"
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/vidra-windows.exe
            artifacts/vidra-x86_64.AppImage
            artifacts/vidra-x86_64.AppImage.zsync
            artifacts/vidra-linux.deb
            artifacts/vidra-android.apk
            artifacts/vidra-android-arm64-v8a.apk
            artifacts/vidra-android-x86_64.apk
            artifacts/vidra-android-armeabi-v7a.apk
            artifacts/SHA2-256SUMS
            artifacts/SHA2-512SUMS
            artifacts/SHA2-256SUMS.sig
            artifacts/SHA2-512SUMS.sig
